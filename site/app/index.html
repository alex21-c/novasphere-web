    <script>
      (function () {
        'use strict';
        if (!new URLSearchParams(window.location.search).has('demo')) return;

        function disableDemoCredentialPrompts() {
          document.querySelectorAll('form').forEach(function (form) {
            form.setAttribute('autocomplete', 'off');
          });
          document.querySelectorAll('input').forEach(function (input) {
            input.setAttribute('autocomplete', 'off');
            input.setAttribute('data-form-type', 'other');
            input.setAttribute('data-lpignore', 'true');
            if (input.type === 'password') {
              input.dataset.demoMasked = 'true';
              input.type = 'text';
            }
            if (input.dataset.demoMasked === 'true') {
              input.style.webkitTextSecurity = 'disc';
            }
          });
        }

        new MutationObserver(disableDemoCredentialPrompts).observe(
          document.documentElement,
          { attributes: true, attributeFilter: ['type'], childList: true, subtree: true }
        );
        disableDemoCredentialPrompts();
      })();
    </script>
    <script>
      // ===== SILENCIAR TODO EL AUDIO DE LA APP DENTRO DE LA PANTALLA DE LA LAPTOP =====
      // Refuerzo respecto al flag ?demo= del bundle: aqui se fuerza el valor INTERNO
      // de cada GainNode a 0 y se bloquean las ramps y la propiedad .value, de modo
      // que aunque el bundle haga master.gain.value = 0.9 nada llega a los altavoces
      // (el sonido de login/arranque queda mudo aunque el app se cargue sin ?demo=).
      (function(){
        'use strict';
        function forceGainSilent(g) {
          var p = g.gain;
          try { p.value = 0; } catch (e) {}
          ['setValueAtTime','linearRampToValueAtTime','setTargetAtTime','exponentialRampToValueAtTime'].forEach(function (m) {
            var orig = p[m];
            if (typeof orig !== 'function') return;
            p[m] = function () {
              var args = Array.prototype.slice.call(arguments);
              // La rampa exponencial no admite 0: se usa el minimo audible
              args[0] = (m === 'exponentialRampToValueAtTime') ? 0.0001 : 0;
              return orig.apply(p, args);
            };
          });
          try {
            Object.defineProperty(p, 'value', { get: function () { return 0; }, set: function () {} });
          } catch (e) { /* AudioParam sellado: los metodos neutralizados bastan */ }
        }
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC && AC.prototype) {
          var proto = AC.prototype;
          if (!proto.__rvMuted) {
            proto.__rvMuted = true;
            var origCreateGain = proto.createGain;
            proto.createGain = function(){
              var g = origCreateGain.call(this);
              forceGainSilent(g);
              return g;
            };
            proto.resume = function(){ return Promise.resolve(); };
          }
        }
        var origPlay = window.HTMLMediaElement.prototype.play;
        if (!origPlay.__rvMuted) {
          origPlay.__rvMuted = true;
          window.HTMLMediaElement.prototype.play = function(){ return Promise.resolve(); };
        }
      })();
    </script>
